[package]
name = "smt4-launcher"
version = "1.0.0"
edition = "2021"
description = "Launcher for smt4-recomp: pick your ROM, build the game, play"
license = "MIT"
publish = false

[dependencies]
rfd = "0.17"
# the release's install, which recompiles the game into a library for the
# Zakuro beside the launcher, with this project's patches and overrides
recomp3ds = { git = "https://github.com/Tony0000/3dsrecomp", branch = "macos" }
smt4-patches = { path = "../patches" }
# checking the Zig it downloads
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS draws the window through wgpu on Metal, its OpenGL being deprecated
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "persistence", "links", "clipboard"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "links", "clipboard"] }

# the Dock's icon, which macOS takes from the app rather than the window:
# the game's, once the ROM is chosen
[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
features = ["std", "NSApplication", "NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep", "NSResponder"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSGeometry"]

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.4"

# Linux's windows, which need a backend named
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
strip = true

# a project of its own, separate from the game's
[workspace]
