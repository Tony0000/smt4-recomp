# Builds and tests what it can without the game on Windows, macOS and Linux:
# the tools and the launcher, and the program linked against a stand-in for
# the recompiled code, which only a build from your own ROM makes.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tools:
    name: Tools and launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Zakuro commit the program builds with
        id: zakuro
        shell: bash
        run: |
          sha=$(awk '/^name = "zakuro"$/{f=1} f&&/^source = /{sub(/.*#/,""); sub(/"$/,""); print; exit}' Cargo.lock)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Tony0000/zakuro
          ref: ${{ steps.zakuro.outputs.sha }}
          path: zakuro
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            patches
            tools/build
            tools/extract
            tools/fit-texture
            launcher
            zakuro
      - name: Linux libraries for the launcher's window and file dialogs, and Zakuro's sound, controllers and windows
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libclang-dev
      - name: MoltenVK, which Zakuro draws with on macOS
        if: runner.os == 'macOS'
        run: brew install molten-vk
      - name: Patches, overrides and cheats
        run: cargo test --release --manifest-path patches/Cargo.toml
      - name: Builder
        run: cargo test --release --manifest-path tools/build/Cargo.toml
      - name: Asset extractor
        run: cargo test --release --manifest-path tools/extract/Cargo.toml
      - name: Texture fitter
        run: cargo test --release --manifest-path tools/fit-texture/Cargo.toml
      - name: Launcher
        run: cargo test --release --manifest-path launcher/Cargo.toml
      - name: Zakuro
        shell: bash
        working-directory: zakuro
        run: |
          # macOS has no OpenGL worth having, Zakuro presents through MoltenVK
          features=
          if [ "$RUNNER_OS" = macOS ]; then features=--no-default-features; fi
          cargo build --release --locked -p zakuro $features
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Package, as a release ships it
        shell: bash
        run: launcher/package.sh
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # relative, Windows paths in GITHUB_WORKSPACE have backslashes
          ZAKURO_BIN: zakuro/target/release/zakuro${{ runner.os == 'Windows' && '.exe' || '' }}

  game:
    name: Program (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # the C side builds with MinGW-w64 on Windows, Rust with it
            toolchain: stable-x86_64-pc-windows-gnu
          - os: macos-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: MinGW-w64 GCC
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: MinGW-w64 on PATH
        if: runner.os == 'Windows'
        run: echo "${RUNNER_TEMP}/msys64/ucrt64/bin" >> "$GITHUB_PATH"
      - name: Linux libraries for sound, controllers, cameras and windows
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libclang-dev
      - name: A stand-in for the recompiled code
        # the tables src/main.rs reads, empty: the program links, it has no
        # game to run
        run: |
          mkdir -p code
          cat > code/stub.c <<'EOF'
          #include <stdint.h>
          const uint32_t recomp_abi = 0;
          const uint32_t recomp_entry_count = 0;
          const uint8_t recomp_entries = 0;
          const uint32_t recomp_module_count = 0;
          const uint8_t recomp_modules = 0;
          EOF
          cc_name=cc
          if [ "$RUNNER_OS" = Windows ]; then cc_name=gcc; fi
          "$cc_name" -O2 -c code/stub.c -o code/stub.o
          ar rcs code/librecomp.a code/stub.o
      - name: Program
        run: cargo build --release
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: No OpenGL on macOS
        if: runner.os == 'macOS'
        run: |
          otool -L target/release/smt4
          ! otool -L target/release/smt4 | grep -q OpenGL
